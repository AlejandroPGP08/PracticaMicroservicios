steps:
  # 1. Compilar Tareas Pendientes con Maven
  - name: 'gcr.io/cloud-builders/maven'
    dir: 'TareasPendientes'
    args: ['clean', 'package', '-DskipTests']
    entrypoint: 'mvn'
  
  # 2. Construir imagen de Tareas Pendientes
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tareas-pendientes:$COMMIT_SHA', '-f', 'TareasPendientes/Dockerfile', 'TareasPendientes']
  
  # 3. Compilar Tareas Completadas con Maven
  - name: 'gcr.io/cloud-builders/maven'
    dir: 'TareasCompletadas'
    args: ['clean', 'package', '-DskipTests']
    entrypoint: 'mvn'
  
  # 4. Construir imagen de Tareas Completadas
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tareas-completadas:$COMMIT_SHA', '-f', 'TareasCompletadas/Dockerfile', 'TareasCompletadas']
  
  # 5. Desplegar Tareas Pendientes en Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tareas-pendientes'
      - '--image=gcr.io/$PROJECT_ID/tareas-pendientes:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
  
  # 6. Desplegar Tareas Completadas en Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tareas-completadas'
      - '--image=gcr.io/$PROJECT_ID/tareas-completadas:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8081'
      - '--memory=512Mi'

images:
  - 'gcr.io/$PROJECT_ID/tareas-pendientes:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tareas-completadas:$COMMIT_SHA'
