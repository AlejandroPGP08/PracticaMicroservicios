# cloudbuild.yaml - Opción B: Construir + Desplegar
steps:
  # 1. Construir microservicios con Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tareas-pendientes:$COMMIT_SHA', '-f', 'TareasPendientes/Dockerfile', 'TareasPendientes']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tareas-completadas:$COMMIT_SHA', '-f', 'TareasCompletadas/Dockerfile', 'TareasCompletadas']
  
  # 2. Desplegar Tareas Pendientes en Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tareas-pendientes'
      - '--image=gcr.io/$PROJECT_ID/tareas-pendientes:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
  
  # 3. Desplegar Tareas Completadas en Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tareas-completadas'
      - '--image=gcr.io/$PROJECT_ID/tareas-completadas:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8081'
      - '--memory=512Mi'
  
  # 4. Desplegar Frontend en Cloud Run o Cloud Storage
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'frontend-tareas'
      - '--image=gcr.io/cloudrun/button'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=API_URL_PENDIENTES=https://tareas-pendientes-abc-uc.a.run.app,API_URL_COMPLETADAS=https://tareas-completadas-xyz-uc.a.run.app'
      - '--source=./frontend'

images:
  - 'gcr.io/$PROJECT_ID/tareas-pendientes:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tareas-completadas:$COMMIT_SHA'

# Variables de sustitución (opcional)
substitutions:
  _SERVICE_NAME_PENDIENTES: 'tareas-pendientes'
  _SERVICE_NAME_COMPLETADAS: 'tareas-completadas'
  _REGION: 'us-central1'